 const introText=({'start':'Từ vựng và tình huống cơ bản để làm quen chủ đề.','closer1':'Học từ vựng và nhận diện cách phát âm. Chạm loa để nghe.','closer2':'Đọc quy tắc và chọn đáp án đúng hoặc viết câu.','communication':'Luyện phản hồi và cách hỏi/đáp trong những tình huống hằng ngày.','skills1':'Đọc đoạn văn ngắn được biên soạn mới và trả lời câu hỏi.','skills2':'Nghe đoạn văn tiếng Anh, có thể phát chậm, rồi viết câu.','lookback':'Kiểm tra nhanh những nội dung vừa học.','advanced':'Câu vận dụng khó hơn. Bài viết cần nhập câu và được chấm Đúng/Sai.'})[l.id];
 let body='';
 if(['start','closer1','lookback'].includes(l.id)){const words=u.words.slice(l.id==='closer1'?2:0,l.id==='closer1'?8:6);body=`<h3>Từ vựng trọng tâm</h3><div class="study-cards">${words.map(x=>`<div class="study"><span><strong>${h(x.en)}</strong><small>${h(x.vi)}</small></span><button class="speak-btn" data-speak="${h(x.en)}" title="Nghe phát âm">🔊</button></div>`).join('')}</div>`;}
 if(l.id==='closer1')body+=`<div class="rule"><strong>Phát âm: </strong>${h(u.sound)}<br>Nghe và nói lại từng từ, sau đó chọn từ có âm/trọng âm đúng.</div>`;
 if(['closer2','advanced'].includes(l.id))body+=`<div class="rule"><strong>Ghi nhớ:</strong> ${h(u.rule)}</div>`;
 if(l.id==='skills1')body+=`<div class="passage"><strong>Reading passage</strong><div style="margin-top:8px">${h(u.reading)}</div></div>`;
 if(l.id==='skills2')body+=`<div class="passage"><strong>Listening passage</strong><p class="caption">Bài nghe tự biên soạn theo chủ điểm, giọng đọc máy.</p><div class="toolrow"><button class="pillbtn" data-listen="normal">▶ Nghe</button><button class="pillbtn" data-listen="slow">🐢 Nghe chậm</button></div></div>`;
 if(l.id==='advanced')body+=`<p class="lead"><strong>Gợi ý luyện viết tự do:</strong> ${h(u.project)}<br><span class="tiny muted">Bài viết tự do không chấm tự động để tránh đánh giá sai các cách diễn đạt hợp lý.</span></p>`;
 root(`<section class="panel"><div class="lesson-breadcrumb">${runMarkup(u,l)}</div><h2>${h(l.en)} — ${h(l.vi)}</h2><p class="lead">${introText}</p>${body}<div class="btnrow"><button class="primary" id="startQuiz">Bắt đầu luyện tập →</button><button class="secondary" data-back>Trở về bài học</button></div></section>`);
 app.querySelectorAll('[data-speak]').forEach(el=>el.onclick=()=>speech(el.dataset.speak));app.querySelectorAll('[data-listen]').forEach(el=>el.onclick=()=>speech(u.listening,el.dataset.listen==='slow'));
 }
 $('#startQuiz').onclick=()=>startQuiz();app.querySelector('[data-back]').onclick=goBack;
}
function startQuiz(){const review=screen.review;
 const u=review?null:DATA.units.find(x=>x.id===screen.id);
 const le=review?null:lessons.find(x=>x.id===screen.lesson);
 const mode=review?'Review '+review+' (Units '+escReview(DATA.reviews[review-1].units)+')':'Unit '+u.id+' · '+le.en;
 if(window.PlayStats&&window.PlayStats.configured&&!window.PlayStats.person()){window.PlayStats.showGate();alert('Hãy nhập tên ở hộp thoại, sau đó nhấn “Bắt đầu luyện tập” thêm lần nữa.');return;}
 if(window.PlayStats&&window.PlayStats.configured&&window.PlayStats.begin(mode)===false)return;
 const qs=review?DATA.reviews[review-1].questions:u.sets[screen.lesson];
 session={u:u?.id||0,lesson:screen.lesson||'',review:review||0,mode,qs:qs.map(q=>({...q})),index:0,answer:null,locked:false,correct:0,mistakes:[],started:Date.now(),finished:false};
 navTo({type:'quiz',id:u?.id||0,lesson:screen.lesson,review:review||0});
}
function quizRender(){if(!session){goBack();return;}const q=session.qs[session.index];const n=session.qs.length;
 const u=session.u?DATA.units[session.u-1]:null;const l=lessons.find(x=>x.id===session.lesson);const isListen=session.lesson==='skills2';
 let parts=`<section class="panel"><div class="quiztop"><span>${session.review?'Review '+session.review:('Unit '+session.u+' • '+h(l?.vi||''))}</span><span class="counter">${session.index+1}/${n}</span></div><div class="quizprogress"><div style="width:${pct(session.index,n)}%"></div></div>`;
 if(isListen){parts+=`<div class="toolrow"><button class="pillbtn" id="hearAgain">🔊 Nghe đoạn bài</button><button class="pillbtn" id="hearSlow">🐢 Nghe chậm</button></div>`;}
 if(session.lesson==='skills1'){parts+=`<details style="margin:0 0 14px"><summary class="pillbtn">📖 Xem lại đoạn đọc</summary><div class="passage">${h(u.reading)}</div></details>`;}
 parts+=`<h2 class="question">${h(q.q)}</h2>`;
 if(q.type==='mc')parts+=`<div class="opts">${q.options.map((x,i)=>`<button class="opt" data-option="${i}" id="opt${i}"><span class="letter">${'ABCD'[i]}</span><span>${h(x)}</span></button>`).join('')}</div>`;
 else parts+=`<div><label class="tiny muted" for="textAnswer">Nhập đáp án tiếng Anh</label><input id="textAnswer" class="answer-area" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Nhập câu trả lời..." maxlength="250"></div><div class="btnrow"><button class="primary" id="checkAnswer">Chấm Đúng/Sai</button></div>`;
 parts+='<div id="resultBox" aria-live="polite"></div><div class="btnrow"><button class="primary hidden" id="nextQuestion">Câu tiếp theo →</button></div></section>';
 root(parts);
 if(q.type==='mc')app.querySelectorAll('[data-option]').forEach(el=>el.onclick=()=>check(+el.dataset.option));
 else{$('#checkAnswer').onclick=()=>{const text=$('#textAnswer').value.trim();if(!text){$('#textAnswer').focus();return;}check(text)};$('#textAnswer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!session.locked){e.preventDefault();$('#checkAnswer').click()}});}
 if(isListen){$('#hearAgain').onclick=()=>speech(u.listening);$('#hearSlow').onclick=()=>speech(u.listening,true);}
 $('#nextQuestion').onclick=()=>{session.index++;session.locked=false;if(session.index>=n)finishQuiz();else quizRender();};
}
function check(value){if(!session||session.locked)return;const q=session.qs[session.index];const correct=q.type==='mc'?value===q.answer:q.answers.some(a=>norm(a)===norm(value));session.locked=true;session.answer=value;
 if(correct)session.correct++;else session.mistakes.push({q:q.q,wrote:q.type==='mc'?q.options[value]:value,correct:q.type==='mc'?q.options[q.answer]:q.answers[0],why:q.why});
 tone(correct);const box=$('#resultBox');const expected=q.type==='mc'?q.options[q.answer]:q.answers[0];
 box.innerHTML=`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'✓ Chính xác! +10 điểm':'✕ Chưa chính xác'}</strong><p>${h(q.why)}</p>${correct?'':`<div class="expected">Đáp án: ${h(expected)}</div>`}</div>`;
 if(q.type==='mc')app.querySelectorAll('[data-option]').forEach(el=>{const n=+el.dataset.option;el.disabled=true;if(n===q.answer)el.classList.add('correct');if(n===value&&!correct)el.classList.add('wrong')});
 else{$('#textAnswer').disabled=true;$('#checkAnswer').disabled=true;}
 $('#nextQuestion').textContent=session.index+1===session.qs.length?'Xem kết quả →':'Câu tiếp theo →';$('#nextQuestion').classList.remove('hidden');
}
function finishQuiz(){if(!session)return;session.finished=true;const correct=session.correct,total=session.qs.length,rate=pct(correct,total),score=correct*10,elapsed=Math.floor((Date.now()-session.started)/1000);
 if(session.u){const key=pkey(session.u,session.lesson);const old=progress[key]||{best:0,attempts:0};progress[key]={best:Math.max(rate,old.best||0),attempts:(old.attempts||0)+1,last:Date.now()};}
 else {const key='rev'+session.review;const old=progress[key]||{best:0,attempts:0};progress[key]={best:Math.max(rate,old.best||0),attempts:(old.attempts||0)+1,last:Date.now()}}
 saveProgress(progress);
 try{window.PlayStats?.finish({score,correct,total,maxScore:total*10,percent:rate,graded:true,note:'English Adventure 7 - luyện tập theo SGK'})}catch(e){console.warn('PlayStats finish:',e)}
 if(rate>=80)tone(true);
 const mistakes=session.mistakes.slice();
 const star=rate>=90?'🏆':rate>=70?'🌟':rate>=50?'👏':'💪';
 let html=`<section class="panel"><div class="result-head"><div class="emoji">${star}</div><h2>${rate>=80?'Xuất sắc!':rate>=60?'Làm tốt lắm!':'Tiếp tục luyện tập nhé!'}</h2><div class="scorebig">${rate}%</div><p>${h(session.mode)} · ${total} câu</p></div><div class="summary-grid"><div class="sumcell"><strong>${correct}/${total}</strong><small>Câu đúng</small></div><div class="sumcell"><strong>${score}</strong><small>Điểm</small></div><div class="sumcell"><strong>${Math.max(1,Math.ceil(elapsed/60))} phút</strong><small>Thời gian</small></div></div>`;
 if(mistakes.length)html+=`<h3>Ôn lại ${mistakes.length} câu cần nhớ</h3><div class="reviewlist">${mistakes.map(x=>`<div class="reviewitem"><strong>${h(x.q)}</strong><div class="wrong">Em chọn: ${h(x.wrote)}</div><div class="right">Đúng: ${h(x.correct)}</div><small>${h(x.why)}</small></div>`).join('')}</div>`;
 else html+='<p class="lead" style="text-align:center">Tất cả câu trả lời đều chính xác!</p>';
 html+=`<div class="btnrow"><button class="primary" id="retry">Chơi lại</button><button class="secondary" id="chooseLessons">${session.review?'Các Unit':'Chọn bài khác'}</button><button class="secondary" id="unitList">Danh sách Unit</button></div></section>`;
 // replace last nav state: previous screen should be lesson intro, not finished quiz
 screen={type:'result',id:session.u,lesson:session.lesson,review:session.review};root(html);
 $('#retry').onclick=()=>{screen={type:'lesson',id:session.u,lesson:session.lesson,review:session.review};startQuiz()};
 $('#chooseLessons').onclick=()=>{session=null;navTo(screen.review?{type:'home'}:{type:'unit',id:screen.id},true)};
 $('#unitList').onclick=()=>{session=null;navTo({type:'home'},true)};
}
function render(){if(screen.type==='home')renderHome();else if(screen.type==='unit')renderUnit();else if(screen.type==='lesson')lessonIntro();else if(screen.type==='quiz')quizRender();else if(screen.type==='result'&&session){finishQuiz()}else renderHome();}
render();
</script>
</body>
</html>
